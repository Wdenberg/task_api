version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: todo-postgres
    restart: always
    environment:
      POSTGRES_DB: tododb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: