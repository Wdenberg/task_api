version: '3.8'

services:
  # 1. Serviço do Banco de Dados PostgreSQL
  postgres-db:
    image: postgres:16-alpine
    container_name: todo-postgres
    restart: always
    environment:
      POSTGRES_DB: tododb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 1992@Berg
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d tododb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - todo-network

  # 2. Serviço da Nossa API Spring Boot 3
  todo-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todo-api-java21
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      # Sobrescrevemos a URL do banco para apontar para o nome do container no Docker (postgres-db), e não mais 'localhost'!
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/tododb
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: 1992@Berg
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - todo-network

volumes:
  postgres_data:

networks:
  todo-network:
    driver: bridge